{% if row.job %}<span class="chip small secondary-container">{{ row.job }}</span>
{% else %}<button class="border small round nowrap" hx-post="/library/queue" hx-vals='{"item": "{{ item_key }}"}'
        hx-target="#toast" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful) this.replaceWith(Object.assign(document.createElement('span'),{className:'chip small secondary-container',textContent:'Queued'}))"><i>playlist_add</i><span>Add to queue</span></button>{% endif %}
