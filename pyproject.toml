[project]
name = "c3parr"
version = "0.1.0"
description = "Gera e ressincroniza legendas a partir do áudio, com tradução que entende o contexto da cena"
authors = [
    { name = "william.donega", email = "william.donega@e-ai.com.br" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
c3parr = "c3parr:main"
c3parr-avaliar = "c3parr.report.evaluate:cli"
c3parr-web = "c3parr.web.app:serve"
c3parr-cuda-processor = "c3parr.processor.server:serve"

[project.optional-dependencies]
asr = [
    "faster-whisper>=1.2.1",
    "soundfile>=0.14.0",
]
embed = [
    "sentence-transformers>=6.2.0",
]
# Legenda de show: separar a voz (Demucs) e encaixar a letra (wav2vec2). `concert` usa a GPU
# NVIDIA quando há (torch com CUDA no Linux x86); `concert-cpu` é o mesmo sem CUDA (imagem menor).
concert = [
    "demucs>=4.1.0",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
]
concert-cpu = [
    "demucs>=4.1.0",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
]
web = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
conflicts = [[{ extra = "concert" }, { extra = "concert-cpu" }]]
# Sem o Mac Intel: o Demucs exige lá numpy<2 e torch<2.3, que o projeto não aceita, e o torch
# não publica mais pacote para ele. Docker (Linux x86 e ARM) e Mac com Apple Silicon seguem iguais.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
]

# O Demucs pede o `sphn` (ler e gravar áudio na linha de comando dele), que não tem pacote pronto
# para Linux ARM e exigiria compilar Rust na imagem. O c3parr não usa essa parte: fica de fora lá.
override-dependencies = ["sphn>=0.2.1; sys_platform != 'linux' or platform_machine != 'aarch64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "concert-cpu" }]
torchaudio = [{ index = "pytorch-cpu", extra = "concert-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "playwright>=1.65.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # dados de exemplo

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "sentence_transformers.*", "soundfile"]
ignore_missing_imports = true

# O extra `concert` (torch e companhia): tratado como "qualquer coisa" esteja ou não instalado,
# para os tipos darem o mesmo resultado no CI (sem o extra) e na máquina de quem desenvolve.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "torchaudio", "torchaudio.*", "demucs.*", "silero_vad"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not models and not network and not e2e'"
markers = [
    "models: usa modelos reais (lento, baixa pesos)",
    "network: faz chamadas de rede reais",
    "e2e: navegador de verdade (Playwright); rode com `pytest -m e2e`",
]
